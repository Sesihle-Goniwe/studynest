name: Deploy Backend to Render

on:
  push:
    branches:
      - main  # Trigger only on pushes to main

jobs:
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # Step 3: Setup Node.js & cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      # Step 4: Verify backend dependencies install cleanly
      - name: Install backend dependencies
        run: |
          cd backend
          pnpm install --frozen-lockfile

      # Step 5: Trigger Render deploy via hook
      - name: Deploy to Render
        run: |
          echo "Triggering backend deploy on Render..."
          curl -s -X POST "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
